<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>果木 · 课程</title>
<style>
  :root { --bg: #faf9f6; --card: #fff; --text: #1a1a1a; --muted: #8a8578;
          --border: #e6e2d8; --accent: #4a7c59; --bad: #c0564e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1b18; --card: #262420; --text: #e8e5de; --muted: #8f8a7d;
            --border: #3a372f; --accent: #7fb08e; --bad: #d97b73; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); min-height: 100dvh;
         display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, "PingFang SC", sans-serif; }
  .boot { font-size: 40px; animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .gate { background: var(--card); border: 1px solid var(--border); border-radius: 16px;
          padding: 34px 28px 26px; width: min(320px, 88vw); text-align: center;
          box-shadow: 0 8px 30px rgba(0,0,0,.06); animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .gate.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .mark { font-size: 34px; margin-bottom: 6px; }
  .gate h1 { font-size: 16px; font-weight: 600; letter-spacing: .12em; }
  .sub { font-size: 12.5px; color: var(--muted); margin: 6px 0 20px; }
  input { width: 100%; padding: 12px 14px; font-size: 18px; text-align: center;
          letter-spacing: .3em; background: var(--bg); color: var(--text);
          border: 1px solid var(--border); border-radius: 10px; }
  input:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; margin-top: 12px; padding: 12px; font-size: 15px; font-weight: 600;
           border: none; border-radius: 10px; background: var(--accent);
           color: #fff; cursor: pointer; transition: opacity .15s; }
  button:disabled { opacity: .55; }
  .err { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 1.2em; }
</style>
</head>
<body>
<div class="boot" id="boot">🌳</div>
<form class="gate" id="gate" hidden>
  <div class="mark">🌳</div>
  <h1>果木 · 课程</h1>
  <p class="sub">输入复习页同款口令解锁</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="口令">
  <button type="submit" id="go">解锁</button>
  <p class="err" id="err"></p>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryPin(pin) {
  try {
    const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(ENC.salt), iterations: 300000, hash: 'SHA-256' },
      raw, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, key, b64(ENC.ct));
    const text = new TextDecoder().decode(pt);
    if (!text.startsWith('guomu:')) return false;
    localStorage.setItem('guomu_pin', pin);
    document.open(); document.write(text.slice(6)); document.close();
    return true;
  } catch { return false; }
}
(async () => {
  const saved = localStorage.getItem('guomu_pin');
  if (saved && await tryPin(saved)) return;
  const gate = document.getElementById('gate');
  document.getElementById('boot').hidden = true;
  gate.hidden = false;
  gate.addEventListener('submit', async ev => {
    ev.preventDefault();
    const go = document.getElementById('go');
    go.disabled = true; go.textContent = '解密中…';
    document.getElementById('err').textContent = '';
    const ok = await tryPin(document.getElementById('pin').value.trim());
    if (!ok) {
      go.disabled = false; go.textContent = '解锁';
      document.getElementById('err').textContent = '口令不对，再试一次';
      gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake');
      document.getElementById('pin').select();
    }
  });
  document.getElementById('pin').focus();
})();
</script>
